name: Build Android APK

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if uploaded directly as archive
        run: |
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found zip archive $ZIP_FILE, extracting..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          if [ ! -f "settings.gradle" ]; then
            SUB_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$SUB_SETTINGS" ]; then
              SUB_DIR=$(dirname "$SUB_SETTINGS")
              echo "Moving project files from $SUB_DIR to root..."
              shopt -s dotglob
              mv "$SUB_DIR"/* . || true
            fi
          fi

      - name: Check Android project files
        id: project
        run: |
          if [ -f settings.gradle ] && [ -f app/build.gradle ] && [ -f app/src/main/assets/index.html ] && [ -f app/src/main/assets/questions_data.js ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android source is not imported yet; skipping APK build."
          fi

      - name: Set up JDK 17
        if: steps.project.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle 8.7
        if: steps.project.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug and Release APKs
        if: steps.project.outputs.available == 'true'
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SMLE-Recall-Pro.apk

      - name: Upload APK to Workflow Artifacts
        if: steps.project.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SMLE-Recall-Pro-APK
          path: |
            SMLE-Recall-Pro.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        if: steps.project.outputs.available == 'true'
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SMLE Recall Pro APK (Build #${{ github.run_number }})"
          body: "Automated Android APK build. Download `SMLE-Recall-Pro.apk` to install on Android."
          files: SMLE-Recall-Pro.apk
