name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Android source archive
        run: |
          set -euo pipefail
          if compgen -G ".build/smle-project.tar.xz.b64.*" > /dev/null; then
            cat .build/smle-project.tar.xz.b64.* | base64 --decode > .build/smle-project.tar.xz
            tar -xJf .build/smle-project.tar.xz -C .
            rm -rf .build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app build.gradle settings.gradle gradle.properties gradle
            if ! git diff --cached --quiet; then
              git commit -m "Import SMLE Recall Pro Android source"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Verify Android project files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/questions_data.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug and Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SMLE-Recall-Pro.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMLE-Recall-Pro-APK
          path: |
            SMLE-Recall-Pro.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SMLE Recall Pro APK (Build #${{ github.run_number }})"
          body: "Automated Android APK build. Download `SMLE-Recall-Pro.apk` to install on Android."
          files: SMLE-Recall-Pro.apk
